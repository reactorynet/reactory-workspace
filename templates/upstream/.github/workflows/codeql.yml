# Managed by reactory-workspace `seed` (policy: public-upstream).
# CodeQL is free on public repositories. Actions are pinned to commit SHAs.
name: CodeQL

on:
  push:
    branches: ["{{default_branch}}"]
  pull_request:
    branches: ["{{default_branch}}"]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ({{codeql_languages}})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          languages: {{codeql_languages}}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          category: "/language:{{codeql_languages}}"
